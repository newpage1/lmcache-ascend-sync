# LMCache-Ascend monkey-patch coverage points
# These are the exact modules/classes/functions that LMCache-Ascend overrides.
# The conflict analyzer will diff these specific paths between upstream versions.

patch_points:
  # 1. C++ kernel replacement: lmcache.c_ops -> lmcache_ascend.c_ops
  - module: "lmcache/c_ops"
    type: "sys.modules_replace"
    ascend_replacement: "lmcache_ascend/c_ops"
    description: "CUDA kernels replaced by CANN kernels at import time"
    key_functions:
      - "multi_layer_kv_transfer"
      - "single_layer_kv_transfer"
      - "host_register"
      - "host_unregister"

  # 2. GPU Connector interface - core abstraction (restructured in v0.4.2 to package)
  - module: "lmcache/v1/gpu_connector/gpu_connectors.py"
    type: "class_inheritance"
    description: "GPUConnectorInterface and its CUDA implementations"
    watch_classes:
      - class: "GPUConnectorInterface"
        watch_methods:
          - "to_gpu"
          - "from_gpu"
          - "batched_to_gpu"
          - "batched_from_gpu"
          - "get_shape"
          - "get_item_size"
          - "get_num_tokens"
      - class: "VLLMPagedMemGPUConnectorV2"
        watch_methods:
          - "_initialize_pointers"
          - "to_gpu"
          - "from_gpu"
          - "__init__"
          - "from_metadata"
      - class: "VLLMBufferLayerwiseGPUConnector"
        watch_methods:
          - "to_gpu"
          - "from_gpu"
          - "__init__"
      - class: "VLLMPagedMemLayerwiseGPUConnector"
        watch_methods:
          - "batched_to_gpu"
          - "batched_from_gpu"
          - "__init__"
      - class: "SGLangNPUConnector"
        watch_methods:
          - "__init__"
      - class: "SGLangLayerwiseNPUConnector"
        watch_methods:
          - "__init__"
    ascend_file: "lmcache_ascend/v1/npu_connector/npu_connectors.py"

  # 2b. GPU Connector utils (LayoutHints added in v0.4.3)
  - module: "lmcache/v1/gpu_connector/utils.py"
    type: "function_replace"
    description: "GPU connector utilities including LayoutHints, permute functions"
    watch_functions:
      - "need_gpu_interm_buffer"
      - "permute_to_contiguous"
      - "permute_kv_caches_to_contiguous"
    ascend_file: "lmcache_ascend/v1/npu_connector/utils.py"

  # 2c. GPU Connector factory (CreateGPUConnector added in v0.4.2)
  - module: "lmcache/v1/gpu_connector/__init__.py"
    type: "function_replace"
    description: "CreateGPUConnector factory function"
    watch_functions:
      - "CreateGPUConnector"
    ascend_file: "lmcache_ascend/v1/npu_connector/__init__.py"

  # 3. Memory allocator
  - module: "lmcache/v1/memory_management.py"
    type: "class_inheritance"
    description: "MixedMemoryAllocator and memory allocation interfaces"
    watch_classes:
      - class: "MixedMemoryAllocator"
        watch_methods:
          - "allocate"
          - "__init__"
      - class: "MemoryAllocatorInterface"
        watch_methods:
          - "allocate"
          - "free"
    ascend_file: "lmcache_ascend/v1/memory_management.py"

  # 4. vLLM adapter - engine initialization (refactored in v0.4.2)
  - module: "lmcache/integration/vllm/vllm_v1_adapter.py"
    type: "class_inheritance"
    description: "LMCacheConnectorV1Impl - vLLM connector implementation"
    watch_classes:
      - class: "LMCacheConnectorV1Impl"
        watch_methods:
          - "__init__"
          - "wait_for_save"
          - "start_load_kv"
          - "get_finished"
          - "request_finished"
      - class: "LMCacheConnectorV1"
        watch_methods:
          - "__init__"
          - "handle_preemptions"
    watch_functions:
      - "_init_lmcache_engine"
      - "init_lmcache_engine"
    ascend_file: "lmcache_ascend/integration/vllm/vllm_v1_adapter.py"

  # 5. Cache Engine (AscendLMCacheEngine subclass added in v0.4.3)
  - module: "lmcache/v1/cache_engine.py"
    type: "class_inheritance"
    description: "LMCacheEngine and LMCacheEngineBuilder"
    watch_classes:
      - class: "LMCacheEngineBuilder"
        watch_methods:
          - "get_or_create"
          - "destroy"
      - class: "LMCacheEngine"
        watch_methods:
          - "__init__"
          - "store"
          - "retrieve"
          - "lookup"
          - "lookup_unpin"
          - "close"
    ascend_file: "lmcache_ascend/v1/cache_engine.py"

  # 6. Metadata (renamed LMCacheEngineMetadata -> LMCacheMetadata in v0.4.2)
  - module: "lmcache/v1/metadata.py"
    type: "class_inheritance"
    description: "LMCacheMetadata (was LMCacheEngineMetadata)"
    watch_classes:
      - class: "LMCacheMetadata"
        watch_methods:
          - "__init__"
          - "get_shapes"
          - "get_dtypes"
    ascend_file: "lmcache_ascend/__init__.py"

  # 7. CacheBlend
  - module: "lmcache/v1/compute/blend/"
    type: "class_inheritance"
    description: "CacheBlend builder and blender"
    watch_classes:
      - class: "LMCBlenderBuilder"
        watch_methods:
          - "get_or_create"
    ascend_file: "lmcache_ascend/v1/blend/"

  # 8. Token database
  - module: "lmcache/v1/token_database.py"
    type: "function_replace"
    description: "Token hashing with ASLR workaround"
    watch_functions:
      - "TokenDatabase._hash_tokens"

  # 9. NUMA detection
  - module: "lmcache/v1/system_detection.py"
    type: "function_replace"
    description: "NUMA detector with Ascend hardware sanitization"
    watch_functions:
      - "NUMADetector._read_from_sys"

  # 10. RPC utils (signature changed in v0.4.2)
  - module: "lmcache/v1/rpc_utils.py"
    type: "function_replace"
    description: "RPC utilities for inter-process communication"
    watch_functions:
      - "get_zmq_rpc_path_lmcache"
    ascend_file: "lmcache_ascend/v1/rpc_utils.py"

  # 11. Lookup client (transport API rewritten in v0.4.2)
  - module: "lmcache/v1/lookup_client/"
    type: "class_inheritance"
    description: "Lookup client for cache lookups"
    watch_classes:
      - class: "LMCacheLookupClient"
        watch_methods:
          - "__init__"
          - "lookup"
    ascend_file: "lmcache_ascend/v1/lookup_client/"

  # 12. Storage backend
  - module: "lmcache/v1/storage_backend/"
    type: "class_inheritance"
    description: "Storage backend interfaces and implementations"
    watch_classes:
      - class: "StorageManager"
        watch_methods:
          - "allocate"
          - "put"
          - "batched_put"
    ascend_file: "lmcache_ascend/v1/storage_backend/"

  # 13. Proxy memory obj (parent() method added in v0.4.2)
  - module: "lmcache/v1/proxy_memory_obj.py"
    type: "class_inheritance"
    description: "ProxyMemoryObj - reference-counted memory object"
    watch_classes:
      - class: "ProxyMemoryObj"
        watch_methods:
          - "parent"
          - "ref_count_down"
    ascend_file: "lmcache_ascend/v1/proxy_memory_obj.py"

  # 14. Config (config definitions injected by Ascend)
  - module: "lmcache/v1/config.py"
    type: "function_replace"
    description: "LMCache engine configuration - Ascend injects extra config fields"
    watch_functions:
      - "_CONFIG_DEFINITIONS"
      - "_validate_config"
    ascend_file: "lmcache_ascend/__init__.py"

  # 15. LMCacheManager (refactored in v0.4.3)
  - module: "lmcache/v1/manager.py"
    type: "class_inheritance"
    description: "LMCacheManager - coordinates engine lifecycle"
    watch_classes:
      - class: "LMCacheManager"
        watch_methods:
          - "_create_lmcache_engine"
    ascend_file: "lmcache_ascend/__init__.py"

  # 16. Transfer channel (hcomm runtime)
  - module: "lmcache/v1/transfer_channel/"
    type: "class_inheritance"
    description: "Transfer channel for distributed KV cache"
    ascend_file: "lmcache_ascend/v1/transfer_channel/"

  # 17. Multiprocess custom types (stride/storage_offset added in v0.4.2)
  - module: "lmcache/v1/multiprocess/"
    type: "class_inheritance"
    description: "Multiprocess types for IPC"
    ascend_file: "lmcache_ascend/v1/multiprocess/"

  # 18. Blend utils (import path updated in v0.4.2)
  - module: "lmcache/v1/compute/blend/utils.py"
    type: "function_replace"
    description: "Blend utilities"
    ascend_file: "lmcache_ascend/v1/blend/utils.py"
