# LMCache-Ascend Sync configuration

upstream:
  repo: "LMCache/LMCache"
  # Monitor these release tag patterns
  tag_patterns:
    - "^v0\\..*$"       # stable releases
  # Check frequency
  schedule: "0 6 * * *"  # daily at 6am UTC
  # Only monitor releases newer than this
  min_version: "v0.3.7"

downstream:
  repo: "LMCache/LMCache-Ascend"
  # Branch to target for PRs
  target_branch: "main"
  # PR branch prefix
  branch_prefix: "sync/upstream-"

sync:
  # Local checkout paths (used by both Actions and local runner)
  upstream_checkout: "/tmp/lmcache-sync/upstream"
  downstream_checkout: "/tmp/lmcache-sync/downstream"

  # Rebase simulation
  rebase:
    enabled: true
    # Max conflicts to attempt auto-resolve
    max_conflicts: 10

  # PR generation
  pr:
    labels:
      - "automated-sync"
      - "upstream-adaptation"
    draft: false
    # Title template: {version} is replaced with upstream version
    title_template: "chore: adapt to upstream LMCache {version}"

# LLM API for code generation (OpenAI-compatible)
# Set via environment variable LLM_API_KEY or OPENAI_API_KEY
llm:
  # GLM-5.1 via Zhipu API (default)
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  model: "glm-5.1"
  max_tokens: 8192
  # To use other providers, change base_url and model:
  # DeepSeek: base_url: "https://api.deepseek.com/v1", model: "deepseek-chat"
  # OpenAI:   base_url: "https://api.openai.com/v1", model: "gpt-4o"
  # Claude:   base_url: "https://api.anthropic.com/v1", model: "claude-sonnet-4-20250514"

# Notification (optional)
notification:
  # Set to true to enable GitHub issue comment on roadmap issue
  github_issue_comment: false
  issue_repo: "LMCache/LMCache-Ascend"
  issue_number: 126
